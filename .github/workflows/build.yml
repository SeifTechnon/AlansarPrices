name: Build AlansarPrices

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alansarprices-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            os: windows-latest
          - platform: Linux
            os: ubuntu-24.04

    steps:
      - name: Check out source code
        uses: actions/checkout@v7

      - name: Set up Python on Windows
        if: runner.os == 'Windows'
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install Linux Python and Tkinter packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-venv python3-tk

      - name: Create Linux build environment
        if: runner.os == 'Linux'
        run: python3 -m venv .venv

      - name: Install build dependencies on Windows
        if: runner.os == 'Windows'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Install build dependencies on Linux
        if: runner.os == 'Linux'
        run: |
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements-build.txt

      - name: Check Python syntax on Windows
        if: runner.os == 'Windows'
        run: python -m compileall -q app.py

      - name: Check Python syntax on Linux
        if: runner.os == 'Linux'
        run: .venv/bin/python -m compileall -q app.py

      - name: Generate application icon on Windows
        if: runner.os == 'Windows'
        run: python make_icon.py

      - name: Generate application icon on Linux
        if: runner.os == 'Linux'
        run: .venv/bin/python make_icon.py

      - name: Build Windows executable
        if: runner.os == 'Windows'
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --noconsole --name AlansarPrices --icon icon.ico --add-data "icon.ico;." app.py

      - name: Build Linux executable
        if: runner.os == 'Linux'
        run: |
          .venv/bin/python -m PyInstaller --noconfirm --clean --onefile --name AlansarPrices --add-data "icon.ico:." app.py

      - name: Verify Windows output
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path 'dist/AlansarPrices.exe')) {
            throw 'Windows executable was not created.'
          }
          if ((Get-Item 'dist/AlansarPrices.exe').Length -le 0) {
            throw 'Windows executable is empty.'
          }

      - name: Verify Linux output
        if: runner.os == 'Linux'
        run: |
          test -s dist/AlansarPrices
          chmod +x dist/AlansarPrices

      - name: Upload Windows build
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: AlansarPrices-Windows
          path: dist/AlansarPrices.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload Linux build
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: AlansarPrices-Linux
          path: dist/AlansarPrices
          if-no-files-found: error
          retention-days: 14
